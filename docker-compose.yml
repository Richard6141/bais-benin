name: bais

services:
  db:
    build:
      context: ./docker/db
    container_name: bais-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bais}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bais}
      POSTGRES_DB: ${POSTGRES_DB:-bais}
      # Les migrations Prisma activent les extensions ; l'image se contente de les fournir.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bais} -d ${POSTGRES_DB:-bais}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bais-app
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # production par défaut : les comptes et codes de démonstration sont alors refusés.
      APP_ENV: ${APP_ENV:-production}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET est obligatoire}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bais}:${POSTGRES_PASSWORD:-bais}@db:5432/${POSTGRES_DB:-bais}?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"

volumes:
  db-data:

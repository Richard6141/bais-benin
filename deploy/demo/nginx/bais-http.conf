# Première étape de l'installation (docs/deploiement-demo.md) : le seul port 80, pour que
# Let's Encrypt vérifie le nom avant l'émission du certificat. Remplacé ensuite par bais.conf.
# Copié dans /etc/nginx/conf.d/bais.conf ; ne revendique que le nom de BAIS.
server {
    listen 51.210.108.173:80;
    server_name bais.51-210-108-173.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bais-acme;
        default_type "text/plain";
        allow all;
    }
    location / { return 404; }
}

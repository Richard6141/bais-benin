# Site BAIS du serveur de démonstration (docs/deploiement-demo.md), copié dans
# /etc/nginx/conf.d/bais.conf. Même forme que les autres sites ajoutés à la main sur ce serveur :
# il ne revendique que son propre nom, le refus des noms inconnus (00-refus-domaines-inconnus)
# reste inchangé. Certificat Let's Encrypt émis et renouvelé par acme.sh (root).
server {
    listen 51.210.108.173:80;
    server_name bais.51-210-108-173.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bais-acme;
        default_type "text/plain";
        allow all;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 51.210.108.173:443 ssl;
    server_name bais.51-210-108-173.sslip.io;
    ssl_certificate     /etc/nginx/bais/bais.crt;
    ssl_certificate_key /etc/nginx/bais/bais.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Photos des signalements (compressées côté téléphone) et lots de synchronisation.
    client_max_body_size 12m;

    # Application arrêtée ou en cours de démarrage (déploiement) : une page d'attente plutôt qu'une
    # erreur de passerelle. Les réponses de l'application elle-même passent telles quelles.
    error_page 502 504 = @demarrage;
    location @demarrage {
        default_type "text/html; charset=utf-8";
        add_header Retry-After 120 always;
        return 503 '<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BAIS</title></head><body style="font-family:system-ui,sans-serif;max-width:36rem;margin:4rem auto;padding:0 1rem;color:#0b2545"><h1>BAIS démarre</h1><p>La plateforme se met à jour. Revenez dans quelques minutes.</p></body></html>';
    }

    # Fil d'activité en direct (flux SSE) : sans mise en tampon, connexion longue.
    location /api/v1/live/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

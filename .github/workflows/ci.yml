name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Une nouvelle proposition (pull request) annule la vérification précédente ; un envoi sur une
# branche ne l'annule jamais, pour ne pas couper un déploiement en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  IMAGE_BASE: ghcr.io/richard6141/bais-benin

jobs:
  quality:
    name: Lint, types et tests unitaires
    runs-on: ubuntu-latest
    env:
      # Exigée par prisma.config.ts pour générer le client ; aucune base n'est contactée ici.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Migrations et tests d'intégration (PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bais
          POSTGRES_PASSWORD: bais
          POSTGRES_DB: bais_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bais -d bais_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://bais:bais@localhost:5432/bais_test?schema=public
      AUTH_SECRET: ci-secret-de-test-ci-secret-de-test-ci-secret
      MESSAGING_PRIMARY_CHANNEL: fixture
      OTP_DEMO_CODE: "246810"
      NPI_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NPI_HASH_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm test:integration

  build:
    name: Build de production
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build

  e2e:
    name: Parcours de bout en bout
    runs-on: ubuntu-latest
    needs: [build]
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bais
          POSTGRES_PASSWORD: bais
          POSTGRES_DB: bais_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bais -d bais_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://bais:bais@localhost:5432/bais_e2e?schema=public
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-secret-de-test-ci-secret-de-test-ci-secret
      MESSAGING_PRIMARY_CHANNEL: console
      OTP_DEMO_CODE: "246810"
      NPI_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NPI_HASH_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Images du serveur de démonstration (docs/deploiement-demo.md), construites ici et jamais sur
  # le serveur : application, outils (migrations, seed) et planificateur, étiquetés par SHA et
  # publiés en privé sur GHCR. Seulement pour un envoi sur develop dont la CI est passée.
  images:
    name: Images Docker (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: [quality, integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Application
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          push: true
          tags: ${{ env.IMAGE_BASE }}/app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Outils (migrations, seed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: tools
          push: true
          tags: ${{ env.IMAGE_BASE }}/tools:${{ github.sha }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools
      - name: Planificateur
        uses: docker/build-push-action@v6
        with:
          context: docker/scheduler
          push: true
          tags: ${{ env.IMAGE_BASE }}/scheduler:${{ github.sha }}

  # Déploiement par SSH : la clé dédiée ne peut lancer que /opt/bais/deploy.sh (commande forcée).
  # Le jeton GHCR éphémère du job passe par l'entrée standard, jamais en argument. Un seul
  # déploiement à la fois ; deploy.sh revient seul à l'image précédente si la santé échoue.
  deploy:
    name: Déploiement de démonstration
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: [images]
    timeout-minutes: 20
    environment:
      name: demo
      url: https://bais.51-210-108-173.sslip.io
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Déployer sur le serveur de démonstration
        env:
          DEPLOY_HOST: ${{ secrets.BAIS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BAIS_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.BAIS_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BAIS_DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/bais_deploy
          chmod 600 ~/.ssh/bais_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/bais_deploy \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy ${{ github.sha }} ${{ github.repository_owner }}"
      - name: Vérifier l'adresse publique
        run: curl -fsS --retry 5 --retry-delay 10 https://bais.51-210-108-173.sslip.io/api/health

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, types et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Migrations et tests d'intégration (PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bais
          POSTGRES_PASSWORD: bais
          POSTGRES_DB: bais_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bais -d bais_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://bais:bais@localhost:5432/bais_test?schema=public
      AUTH_SECRET: ci-secret-de-test-ci-secret-de-test-ci-secret
      MESSAGING_PRIMARY_CHANNEL: fixture
      OTP_DEMO_CODE: "246810"
      NPI_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NPI_HASH_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm test:integration

  build:
    name: Build de production
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build

  e2e:
    name: Parcours de bout en bout
    runs-on: ubuntu-latest
    needs: [build]
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bais
          POSTGRES_PASSWORD: bais
          POSTGRES_DB: bais_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bais -d bais_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://bais:bais@localhost:5432/bais_e2e?schema=public
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-secret-de-test-ci-secret-de-test-ci-secret
      MESSAGING_PRIMARY_CHANNEL: console
      OTP_DEMO_CODE: "246810"
      DEMO_ACCOUNT_PASSWORD: Demo-Bais-2026!
      NPI_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NPI_HASH_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
